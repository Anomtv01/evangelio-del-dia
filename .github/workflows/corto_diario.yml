name: Short Diario del Evangelio

# Serie diaria de Shorts del Evangelio.
# Horario: 11:00 UTC.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  generar-y-subir:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requisitos.txt

      - name: Verificar fuentes para la miniatura
        run: |
          if [ ! -f fonts/Lora-Bold.ttf ]; then
            sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Reconstruir credenciales de Google
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_CONTENT: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          python3 -c "import os; open('client_secret.json','w').write(os.environ['CLIENT_SECRET_CONTENT']); open('token.json','w').write(os.environ['TOKEN_CONTENT']); print('Archivos escritos.')"

      - name: Generar y subir el Short del Evangelio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generar_todo_corto.py

      # Solo conserva archivos cuando ocurre un error.
      # Se eliminan automáticamente después de un día.
      - name: Guardar archivos para revisar un error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-corto-diario-${{ github.run_number }}
          path: output_corto/
          retention-days: 1
          if-no-files-found: ignore
