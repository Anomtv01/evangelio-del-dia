name: Short Diario del Evangelio

# ---------------------------------------------------------------------------
# Serie diaria de Shorts (2 minutos) dramatizando una historia del Evangelio,
# rotando entre las 50 historias mas conocidas de los 4 Evangelios. Voz
# ElevenLabs (voces_elevenlabs.py, PAGA, requiere el secreto
# ELEVENLABS_API_KEY), portada especifica de cada historia
# (fotos_cortos/<clave>.jpg, generada una sola vez con Canva IA), video
# VERTICAL 1080x1920.
# Horario: 11:00 UTC = 7:00 AM en Nueva York (EDT) — dentro de la ventana de
# 6-8 AM que mejor rinde para Shorts. No choca con el Evangelio (4 UTC), el
# Santo (16 UTC) ni el Salmo (18 UTC).
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  generar-y-subir:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: pip install -r requisitos.txt

      - name: Verificar fuentes para la miniatura
        run: |
          if [ ! -f fonts/Lora-Bold.ttf ]; then
            sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Reconstruir credenciales de Google
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_CONTENT: ${{ secrets.GOOGLE_TOKEN }}
        run: python3 -c "import os; open('client_secret.json','w').write(os.environ['CLIENT_SECRET_CONTENT']); open('token.json','w').write(os.environ['TOKEN_CONTENT']); print('Archivos escritos.')"

      - name: Generar y subir el Short del Evangelio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generar_todo_corto.py

      - name: Guardar los archivos generados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-corto-diario
          path: output_corto/
          retention-days: 7
