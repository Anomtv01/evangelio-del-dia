name: Santo del Dia

on:
  schedule:
    # 15:00 UTC = 11:00 AM hora de Nueva York en horario de verano (EDT).
    # Distinto horario que el Evangelio (10 UTC) para no competir por
    # recursos ni saturar las mismas APIs al mismo tiempo.
    - cron: "0 15 * * *"
  workflow_dispatch:
    # Permite correrlo a mano desde la pestaña "Actions" de GitHub, con un
    # boton, para probar sin esperar al horario programado.

jobs:
  generar-y-subir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: pip install -r requisitos.txt

      - name: Reconstruir las credenciales de Google (desde los Secrets)
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_CONTENT: ${{ secrets.GOOGLE_TOKEN }}
        run: python3 -c "import os; open('client_secret.json','w').write(os.environ['CLIENT_SECRET_CONTENT']); open('token.json','w').write(os.environ['TOKEN_CONTENT']); print('Archivos escritos.')"

      - name: Generar y subir el Santo del dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generar_todo_santo.py

      - name: Guardar los archivos generados (por si hay que revisar algo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-santo-del-dia
          path: output_santo/
          retention-days: 7
