name: Salmo del Dia

# ---------------------------------------------------------------------------
# CAMBIOS
# 1) ELEVENLABS: eliminado. La voz ahora es edge-tts (gratis, ilimitado).
#    El paso fallaba porque generar_video_salmo.py salia con error si no
#    encontraba ELEVENLABS_API_KEY.
# 2) HORARIO: 18:00 UTC = 2:00 PM en Nueva York (EDT), dentro de la ventana
#    12PM-7PM ET del publico latino de EE.UU., y dos horas despues del Santo
#    (16:00 UTC) para no competir entre si.
# 3) TIEMPO: un video de 11 minutos tarda unos 10 min en renderizar.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  generar-y-subir:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: |
          pip install -r requisitos.txt
          pip install --upgrade edge-tts

      - name: Verificar que hay fuentes para la miniatura
        run: |
          if [ ! -f fonts/Lora-Bold.ttf ]; then
            echo "AVISO: falta fonts/Lora-Bold.ttf; se usaran las fuentes DejaVu."
            sudo apt-get install -y fonts-dejavu-core
          fi

      - name: Comprobar que edge-tts alcanza el servicio de voz
        run: |
          python -c "
          import asyncio, edge_tts
          async def main():
              v = await edge_tts.list_voices()
              es = [x for x in v if x['Locale'].startswith('es-')]
              print('edge-tts OK: %d voces en espanol' % len(es))
              assert es, 'No se recibieron voces en espanol'
          asyncio.run(main())
          "

      - name: Reconstruir las credenciales de Google (desde los Secrets)
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_CONTENT: ${{ secrets.GOOGLE_TOKEN }}
        run: python3 -c "import os; open('client_secret.json','w').write(os.environ['CLIENT_SECRET_CONTENT']); open('token.json','w').write(os.environ['TOKEN_CONTENT']); print('Archivos escritos.')"

      - name: Generar y subir el Salmo del dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generar_todo_salmo.py

      - name: Guardar los archivos generados (por si hay que revisar algo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-salmo-del-dia
          path: output_salmo/
          retention-days: 7
