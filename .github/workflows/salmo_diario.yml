name: Salmo del Dia

on:
  schedule:
    # 14:00 UTC. Distinto horario que el Evangelio (04:00) y el Santo (09:00)
    # para repartir el contenido durante el día y no saturar las mismas APIs
    # al mismo tiempo. (Recordá que GitHub puede retrasar las tareas cron.)
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generar-y-subir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: pip install -r requisitos.txt

      - name: Reconstruir las credenciales de Google (desde los Secrets)
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_CONTENT: ${{ secrets.GOOGLE_TOKEN }}
        run: python3 -c "import os; open('client_secret.json','w').write(os.environ['CLIENT_SECRET_CONTENT']); open('token.json','w').write(os.environ['TOKEN_CONTENT']); print('Archivos escritos.')"

      - name: Generar y subir el Salmo del dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generar_todo_salmo.py

      - name: Guardar los archivos generados (por si hay que revisar algo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-salmo-del-dia
          path: output_salmo/
          retention-days: 7
