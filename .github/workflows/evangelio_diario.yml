name: Evangelio del Dia

on:
  schedule:
    # 10:00 UTC = 6:00 AM hora de Nueva York en horario de verano (EDT).
    # Si querés otro horario, cambiá estos dos números (hora minuto, en UTC).
    - cron: "0 4 * * *"
  workflow_dispatch:
    # Esto permite tambien correrlo a mano desde la pestaña "Actions" de
    # GitHub, con un boton, para probar sin esperar al horario programado.

jobs:
  generar-y-subir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: pip install -r requisitos.txt

      - name: Reconstruir las credenciales de Google (desde los Secrets)
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TOKEN_CONTENT: ${{ secrets.GOOGLE_TOKEN }}
        run: python3 -c "import os; open('client_secret.json','w').write(os.environ['CLIENT_SECRET_CONTENT']); open('token.json','w').write(os.environ['TOKEN_CONTENT']); print('Archivos escritos.')"

      - name: Verificar que las credenciales sean JSON valido (sin mostrar el contenido)
        run: |
          echo "Tamaño de client_secret.json: $(wc -c < client_secret.json) bytes"
          echo "Tamaño de token.json: $(wc -c < token.json) bytes"
          python3 -c "import json; json.load(open('client_secret.json')); print('client_secret.json: JSON valido')" || echo "client_secret.json: JSON INVALIDO"
          python3 -c "import json; json.load(open('token.json')); print('token.json: JSON valido')" || echo "token.json: JSON INVALIDO"

      - name: Generar y subir el Evangelio del dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python generar_todo.py

      - name: Guardar los archivos generados (por si hay que revisar algo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-del-dia
          path: output/
          retention-days: 7
